{% load static %}
<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Django Starter{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% url 'home' %}">Django Starter</a>
      <div class="navbar-nav ms-auto align-items-lg-center">
        {% if user.is_authenticated %}
          <a class="nav-link" href="{% url 'profile' %}">{{ user.username }}</a>
          <form method="post" action="{% url 'logout' %}" class="d-inline">{% csrf_token %}<button class="btn btn-outline-light btn-sm ms-lg-2" type="submit">Вийти</button></form>
        {% else %}
          <a class="nav-link" href="{% url 'login' %}">Увійти</a>
          <a class="btn btn-light btn-sm ms-lg-2" href="{% url 'register' %}">Реєстрація</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="container py-5">
    {% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
