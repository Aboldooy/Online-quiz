{% extends 'base.html' %}
{% block title %}Приєднатися · QuizHub{% endblock %}
{% block content %}<div class="card auth-card shadow-sm border-0"><div class="card-body p-4"><h1 class="h3">Приєднатися за кодом</h1><p class="text-muted">Попросіть код у автора вікторини.</p><form method="post">{% csrf_token %}<label class="form-label" for="{{ form.invite_code.id_for_label }}">{{ form.invite_code.label }}</label>{{ form.invite_code }}{% for error in form.invite_code.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}<button class="btn btn-primary w-100 mt-3">Знайти вікторину</button></form></div></div>{% endblock %}
